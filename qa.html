<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>训练簿自动验收</title>
<style>
body{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f6f4;color:#20251f;margin:0;padding:22px}
main{max-width:720px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}
h1{font-size:22px;margin:0 0 6px}.muted{color:#69736b;font-size:13px}
button{border:0;border-radius:10px;padding:12px 16px;background:#315f45;color:white;font-weight:700;font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #e8ebe7}
.pass{color:#267447;font-weight:700}.fail{color:#b33b32;font-weight:700}
iframe{position:absolute;width:1px;height:1px;left:-10000px;border:0}
</style></head><body><main>
<h1>训练簿 · 自动化验收</h1>
<p class="muted">只使用独立测试数据 trainingBook_v3_test，不读取、不修改正式训练簿数据。</p>
<button id="run">运行一键验收</button> <button id="clear" style="background:#68736b">清理测试数据</button>
<div id="results" aria-live="polite"></div>
<iframe id="app" src="./index.html?mode=test"></iframe>
</main>
<script>
const results=document.getElementById('results');
const frame=document.getElementById('app');
const KEY='trainingBook_v3_test';
function line(name,ok,detail=''){const el=document.createElement('div');el.className='row';const left=document.createElement('span');left.textContent=name+(detail?' · '+detail:'');const right=document.createElement('span');right.className=ok?'pass':'fail';right.textContent=ok?'通过':'失败';el.append(left,right);results.appendChild(el);}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function loadFrame(){return new Promise((resolve,reject)=>{frame.onload=()=>resolve(frame.contentWindow);frame.onerror=reject;frame.src='./index.html?mode=test&run='+Date.now()})}
document.getElementById('clear').onclick=()=>{localStorage.removeItem(KEY);results.innerHTML='';line('测试数据',true,'已清理；正式数据未受影响')};
document.getElementById('run').onclick=async()=>{
 const btn=document.getElementById('run');btn.disabled=true;results.innerHTML='';
 let stage='初始化测试页面';
 try{
  stage='清理隔离测试数据';
  const productionBefore=localStorage.getItem('trainingBook_v3');
  localStorage.removeItem(KEY);
  stage='加载训练簿测试环境';
  let w=await loadFrame();
  w.alert=()=>{};w.confirm=()=>true;
  stage='检查基础数据与日期函数';
  const checks=[];
  // 测试环境明确完成训练启用确认；仅修改隔离的 trainingBook_v3_test。
  w.__trainingBookTest.getDb().allowed=true;
  localStorage.setItem(KEY,JSON.stringify(w.__trainingBookTest.getDb()));
  checks.push(['测试环境训练授权',w.__trainingBookTest.getDb().allowed===true,'仅对隔离测试数据生效']);
  checks.push(['本地日期格式',w.formatLocalDate(new Date(2026,0,2,0,30))==='2026-01-02','按设备本地年月日计算，不使用UTC日期']);
  checks.push(['本地日期跨日边界',w.formatLocalDate(new Date(2026,0,1,23,59))==='2026-01-01'&&w.formatLocalDate(new Date(2026,0,2,0,1))==='2026-01-02','午夜前后日期不串日']);
  const validBackup={plans:[{id:'T',day:1,items:[['测试动作',1,'8','60秒']]}],logs:[],measures:[]};
  checks.push(['备份结构校验',w.validateBackupData(validBackup).ok,'有效备份结构可通过']);
  checks.push(['损坏备份拦截',!w.validateBackupData({plans:[],logs:'bad'}).ok,'无效结构不能覆盖正式数据']);
  checks.push(['测试环境隔离',!!JSON.parse(localStorage.getItem(KEY)||'null'),'测试数据空间已创建']);
  stage='打开训练前动作确认';
  w.startPlan('A');await wait(100);
  checks.push(['训练前动作确认',w.document.getElementById('modal').classList.contains('show')&&w.document.getElementById('modalTitle').textContent.includes('训练前动作确认'),'开始训练前先确认动作']);
  if(!w.document.getElementById('modal').classList.contains('show'))throw new Error('训练前确认弹窗未打开：请检查测试授权或训练计划初始化');
  stage='替换动作并确认开练';
  w.setPrestartExercise(0,'臀桥');await wait(50);
  checks.push(['替代动作预选',w.__trainingBookTest.getDraft()[0].exercise==='臀桥','本次训练动作已替换，原计划不变']);
  w.confirmStartPlan();await wait(150);
  checks.push(['确认后开始训练',w.document.getElementById('activeLog').style.display!=='none'&&w.__trainingBookTest.getActive().plan.items[0][0]==='臀桥','训练记录面板使用预选动作']);
  stage='记录第一组训练数据';
  w.document.getElementById('kg-0-0').value='10';
  w.document.getElementById('reps-0-0').value='10';
  w.document.getElementById('rpe-0-0').value='7';
  w.saveSet(0,0);await wait(100);
  let d=JSON.parse(localStorage.getItem(KEY)||'{}');
  checks.push(['单组保存',!!(d.activeSession&&d.activeSession.sets&&d.activeSession.sets.length===1),'重量、次数、RPE 已保存']);
  stage='刷新并恢复训练';
  await loadFrame();w=frame.contentWindow;w.alert=()=>{};
  d=JSON.parse(localStorage.getItem(KEY)||'{}');
  checks.push(['训练中刷新恢复',!!(d.activeSession&&d.activeSession.sets&&d.activeSession.sets.length===1)&&w.document.getElementById('activeLog').style.display!=='none','未完成训练与已记录组数恢复']);
  checks.push(['预选动作刷新保留',w.__trainingBookTest.getActive().plan.items[0][0]==='臀桥'&&d.activeSession.planSnapshot.items[0][0]==='臀桥','刷新后仍保留本次自选动作']);
  stage='测试休息计时器';
  // 使用可控时钟验证倒计时状态机，避免隐藏 iframe 的后台节流造成误报。
  const nativeSetInterval=w.setInterval,nativeClearInterval=w.clearInterval;
  let timerTick=null,timerCleared=false;
  w.setInterval=(fn)=>{timerTick=fn;return 987654};
  w.clearInterval=(id)=>{if(id===987654)timerCleared=true};
  w.timerSet(2);w.timerStart();
  const timerStarted=w.document.getElementById('timerDisplay').textContent==='00:02';
  if(timerTick){timerTick();timerTick()}
  const timerFinished=w.document.getElementById('timerDisplay').textContent==='00:00'&&timerCleared;
  w.setInterval=nativeSetInterval;w.clearInterval=nativeClearInterval;
  checks.push(['休息计时器',timerStarted&&timerFinished,'模拟推进2秒，显示归零且计时器停止']);
  stage='结束训练并写入历史';
  w.finishSession();await wait(200);
  d=JSON.parse(localStorage.getItem(KEY)||'{}');
  checks.push(['结束训练与历史写入',!!(d.logs&&d.logs.length===1&&d.sessions&&d.sessions.length===1),'训练组数和训练总结已写入']);
  stage='检查训练表现分析';
  w.showLifePanel('data');await wait(80);
  const analysisStats=w.document.getElementById('trainingAnalysisStats');
  const weeklyRows=w.document.querySelectorAll('#weeklyTrainingVolume .listrow');
  const exerciseRows=w.document.querySelectorAll('#exerciseProgressList .listrow');
  checks.push(['训练分析统计卡片',!!(analysisStats&&analysisStats.textContent.includes('训练容量')&&analysisStats.textContent.includes('完成组数')),'训练次数、天数、容量、组数与RPE可显示']);
  checks.push(['最近8周训练容量',weeklyRows.length===8,'按自然周展示8周训练容量']);
  checks.push(['动作表现历史',exerciseRows.length>=1&&w.document.getElementById('exerciseProgressList').textContent.includes('臀桥'),'可查看最近训练动作及重量次数记录']);
  checks.push(['个人动作记忆',!!(d.exerciseMemory&&d.exerciseMemory['臀桥']&&d.exerciseMemory['臀桥'].status==='tried'&&d.exerciseMemory['臀桥'].timesUsed===1),'首次训练后自动记录为已体验']);
  await loadFrame();w=frame.contentWindow;w.alert=()=>{};
  d=JSON.parse(localStorage.getItem(KEY)||'{}');
  checks.push(['刷新后数据保留',!!(d.logs&&d.logs.length===1&&d.sessions&&d.sessions.length===1),'刷新后仍可读取历史记录']);
  checks.push(['正式数据隔离',localStorage.getItem('trainingBook_v3')===productionBefore,'正式数据与测试数据完全隔离']);
  stage='测试动作记忆与偏好筛选';
  w.openPrestartPlan('A');await wait(50);
  w.setExercisePreference('臀桥','like');await wait(50);
  checks.push(['个人偏好评价',w.__trainingBookTest.getDb().exerciseMemory['臀桥'].preference==='like','喜欢/一般/不喜欢评价可保存']);
  w.setPrestartFilter('liked');await wait(30);
  checks.push(['按偏好筛选',w.prestartOptions(w.__trainingBookTest.getDraft()[0]).includes('臀桥'),'喜欢的动作可在偏好筛选中找到']);
  w.closeModal();
  // V16 动作教学验收：检查四套计划中的主动作教学及替代动作视频入口
  stage='检查主动作及替代动作视频入口';
  let teachingOk=true,teachingCount=0,alternativeCount=0;
  for(const pid of ['A','B','C','D']){
   w.showPlan(pid);await wait(80);
   const names=[...w.document.querySelectorAll('#modalBody .exercise-pick')];
   for(let i=0;i<names.length;i++){
    w.selectTeachingExercise(i);await wait(30);
    const body=w.document.getElementById('modalBody');
    const alts=body.querySelectorAll('.v16-alt-card');
    const video=body.querySelector('.v16-video-wrap,.v16-video-fallback');
    const hasDomesticLinks=[...body.querySelectorAll('a[href*="bilibili.com"]')].length>=1;
    const embeddedMain=!!body.querySelector('.v16-video-wrap .video-frame iframe[src*="player.bilibili.com/player.html?bvid="]');
    if(!embeddedMain||alts.length<2||!hasDomesticLinks)teachingOk=false;
    teachingCount++;alternativeCount+=alts.length;
   }
  }
  w.closeModal();
  checks.push(['V16.3 主动作国内视频内嵌检查',teachingOk,teachingCount+'个主动作均有具体B站内嵌播放器']);
  checks.push(['V16.3 替代动作教学入口',teachingOk&&alternativeCount>=teachingCount*2,alternativeCount+'个替代动作均配置B站演示入口']);
  // V16.2：替代动作必须直接内嵌 B 站播放器，不再要求用户筛选搜索结果
  stage='检查替代动作内嵌播放器';
  let embeddedAlternatives=true,embeddedCount=0;
  for(const pid of ['A','B','C','D']){
   w.showPlan(pid);await wait(80);
   const picks=[...w.document.querySelectorAll('#modalBody .exercise-pick')];
   for(let i=0;i<picks.length;i++){
    w.selectTeachingExercise(i);await wait(40);
    const cards=[...w.document.querySelectorAll('#modalBody .v16-alt-card')];
    if(cards.length<2||cards.some(c=>!c.querySelector('iframe[src*="player.bilibili.com/player.html?bvid="]')))embeddedAlternatives=false;
    embeddedCount+=cards.length;
   }
  }
  w.closeModal();
  checks.push(['V16.3 替代动作直接内嵌视频',embeddedAlternatives,embeddedCount+'个替代动作卡片均包含B站播放器']);
  checks.forEach(x=>line(x[0],x[1],x[2]));
  const n=checks.filter(x=>x[1]).length;
  line('总结果',n===checks.length,n+'/'+checks.length+' 项通过');
 }catch(e){const detail=(e&&e.stack)?String(e.stack):String(e);line('失败阶段：'+stage,false,detail);}
 btn.disabled=false;
};
</script></body></html>
